<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
 <!-- The seventh icon of this set. Drawn to the same pen as its siblings -
      32 viewBox, 1.5 on the structure - so a row that shows a cash account
      beside a bank account shows two icons from one hand, not two sets. -->
 <!-- Banknote body -->
 <rect x="3" y="8" width="26" height="16" rx="2" ry="2" />
 <!-- The coin at its centre, which is what separates cash from every other
      rectangle in this set -->
 <circle cx="16" cy="16" r="4" />
 <!-- Corner marks, at the same weight as the interior details of
      bankAccountSvg.svg -->
 <path d="M7 12h1.5" stroke-width="1.2" />
 <path d="M23.5 20H25" stroke-width="1.2" />
</svg>
