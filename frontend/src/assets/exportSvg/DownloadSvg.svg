<!-- frontend/src/assets/exportSvg/DownloadSvg.svg -->
<!-- The download mark for the control that saves a list as a CSV. Same 24 box,
     stroke width and caps as the list bars' own icons, so it sits in a toolbar
     without being re-tuned. -->
<svg
 xmlns="http://www.w3.org/2000/svg"
 viewBox="0 0 24 24"
 fill="none"
 stroke="currentColor"
 stroke-width="2"
 stroke-linecap="round"
 stroke-linejoin="round"
 aria-hidden="true"
 focusable="false"
>
 <line x1="12" y1="3" x2="12" y2="15" />
 <polyline points="7 10 12 15 17 10" />
 <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" />
</svg>
