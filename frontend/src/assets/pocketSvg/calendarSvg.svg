<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
 <!-- The plan's schedule: a window of months. Drawn with the same pen as
      bankSvg.svg and walletSvg.svg -- 0.375 for the strokes that name the
      object, 0.35 for the detail inside it, 0.32 for the tight parallel
      strokes that would fill in at size. The drawing spans 3 to 21 across and
      3 to 21 down, the box the rest of the set stands in.
      It has to survive two boxes: --size-badge on the card head and --space-6
      below 480px of container, where the board scales the pen to 1 on this 24
      unit grid. Every gap below is measured at the narrow size as well as the
      wide one, which is why the day marks are short and widely spaced rather
      than the even grid a calendar would carry at one size only. -->
 <!-- The sheet -->
 <rect x="3" y="5.5" width="18" height="15.5" rx="1.5" stroke="currentColor" stroke-width="0.375" stroke-linejoin="round"/>
 <!-- The two hangers, crossing the top edge rather than stopping on it, so the
      sheet reads as hung and not as a plain framed box -->
 <path d="M8 3V7M16 3V7" stroke="currentColor" stroke-width="0.35" stroke-linecap="round"/>
 <!-- The rule under the month band. Butt ends and not the set's round caps:
      this one has to meet both walls of the sheet, and a round cap sitting on
      a wall paints outside it. -->
 <path d="M3 10H21" stroke="currentColor" stroke-width="0.35"/>
 <!-- Two rows of three day marks, the lightest weight in the set: six short
      parallel strokes at the body weight close their gaps and read as two
      solid bars. Each mark is 2 units long with 2.5 units of ground between,
      so at 24px with the pen at 1 they still resolve as three separate marks. -->
 <path d="M6.5 13.67H8.5M11 13.67H13M15.5 13.67H17.5" stroke="currentColor" stroke-width="0.32" stroke-linecap="round"/>
 <path d="M6.5 17.33H8.5M11 17.33H13M15.5 17.33H17.5" stroke="currentColor" stroke-width="0.32" stroke-linecap="round"/>
</svg>
