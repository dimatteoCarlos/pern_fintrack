<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.375" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
 <!-- The same pen as PiggyUniversalCoinSvg.svg: 0.26 on the coin edge, 0.24 on
      the building. The rim was r 10.4 while the wallet and the bullseye both
      draw 3 to 21, so this one read a sixth larger than its siblings at the
      same rendered size. It is r 9 now and everything inside is scaled about
      the centre by that same 0.8654.
      The eight rim pips drop to r 0.13, one pen width across, which is what the
      note here always claimed: at r 0.30 they struck 2.3 times heavier than
      every line around them. -->
 <circle cx="12" cy="12" r="9" />
 <g fill="currentColor" stroke="none">
  <circle cx="18.40" cy="12.00" r="0.13" />
  <circle cx="16.53" cy="7.47" r="0.13" />
  <circle cx="12.00" cy="5.60" r="0.13" />
  <circle cx="7.47" cy="7.47" r="0.13" />
  <circle cx="5.60" cy="12.00" r="0.13" />
  <circle cx="7.47" cy="16.53" r="0.13" />
  <circle cx="12.00" cy="18.40" r="0.13" />
  <circle cx="16.53" cy="16.53" r="0.13" />
 </g>
 <!-- Pediment -->
 <path d="M 8.19 11.31 L 12.00 8.89 L 15.81 11.31" stroke-width="0.35" />
 <!-- Plinth -->
 <path d="M 7.85 15.11 H 16.15" stroke-width="0.35" />
 <!-- Columns -->
 <path d="M 10.44 11.65 V 14.77" stroke-width="0.35" />
