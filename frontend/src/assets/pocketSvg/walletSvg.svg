<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <!-- Drawn with the same pen as PiggyUniversalCoinSvg.svg: 0.26 for the shape
       that names the object and 0.24 for the detail inside it. The set renders
       at 4rem, where 0.26 lands just under a pixel, so a heavier weight here
       would read as a different set of icons rather than a different subject. -->
  <!-- Wallet body with rounded front flap -->
  <path d="M19 7H5C3.9 7 3 7.9 3 9V18C3 19.1 3.9 20 5 20H19C20.1 20 21 19.1 21 18V9C21 7.9 20.1 7 19 7Z" stroke="currentColor" stroke-width="0.375" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Folded top flap -->
  <path d="M5 7L17 4.5C18.05 4.28 19.08 4.96 19.3 6L19.5 7" stroke="currentColor" stroke-width="0.35" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wallet clasp -->
  <path d="M16 12H19V15H16C15.17 15 14.5 14.33 14.5 13.5C14.5 12.67 15.17 12 16 12Z" stroke="currentColor" stroke-width="0.35" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
