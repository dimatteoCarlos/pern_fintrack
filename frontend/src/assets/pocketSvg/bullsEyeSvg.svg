<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <!-- The same pen as PiggyUniversalCoinSvg.svg: 0.375 on the rings that name
       the object, 0.33 on the arrow. At 4rem on a 24 unit grid, 0.375 renders
       exactly one device pixel.
       The target sits down and left of the box centre, at 10.5 13.5, because
       the arrow's tail needs the upper right corner. -->
  <!-- Outer ring -->
  <circle cx="10.5" cy="13.5" r="8.5" stroke="currentColor" stroke-width="0.375" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Middle ring -->
  <circle cx="10.5" cy="13.5" r="5.4" stroke="currentColor" stroke-width="0.375" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Centre ring -->
  <circle cx="10.5" cy="13.5" r="2.7" stroke="currentColor" stroke-width="0.375" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- The shaft, point at the dead centre and running out through the rings at
       45 degrees to the inner corner of the tail. It crosses the outer ring on
       purpose: an arrow that stops short of the target it struck reads as an
       arrow lying beside it. -->
  <path d="M 10.5 13.5 L 18.0 6.0" stroke="currentColor" stroke-width="0.33" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- The tail is a right-angled bracket with body: one limb straight up, one
       straight right, both ends cut at 45 degrees so every cut stays parallel
       to the shaft, and the two sharing the diagonal edge where the shaft
       arrives.
       The limbs run 2.9 long by 1.9 thick, near three to two. An earlier pass
       had them 3.2 by 1.3, near five to two, which drew two thin straps rather
       than the blocky tail the reference carries. -->
  <!-- Upward limb -->
  <path d="M 18.0 6.0 L 18.0 3.1 L 19.9 1.2 L 19.9 4.1 Z" stroke="currentColor" stroke-width="0.33" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Rightward limb -->
  <path d="M 19.9 4.1 L 22.8 4.1 L 20.9 6.0 L 18.0 6.0 Z" stroke="currentColor" stroke-width="0.33" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
